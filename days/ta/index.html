<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>கிழமை எழுதலாம் வாங்க</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="கிழமை">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<style>
  /* Noto Sans Tamil SemiBold, SIL Open Font License 1.1 (Google Noto). Bundled font: the stroke paths below were traced from exactly this font, so it must not be swapped. */
  @font-face{font-family:'NSTa';src:url('noto-sans-tamil-600.woff2') format('woff2');font-weight:600;font-display:block}
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;
    font-family:'NSTa','Tamil Sangam MN','Latha','Nirmala UI',system-ui,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #top{flex:0 0 20%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);
    align-items:center;column-gap:1.5vw;
    padding:0 max(2.5vw,env(safe-area-inset-right)) 0 max(2.5vw,env(safe-area-inset-left));
    background:#f1f6fc;border-bottom:2px solid #cfe0f2}
  #prog{display:flex;flex-direction:column;align-items:flex-start;gap:1.6vh}
  #mid{display:flex;align-items:center;justify-content:center;min-width:0}
  #msg{font-size:min(5.6vh,3.4vw);font-weight:600;color:#1d3557;text-align:center;line-height:1.25}
  #dots{display:flex;gap:.5vw;align-items:flex-end}
  #dots button{position:relative;overflow:hidden;width:min(5vw,52px);min-width:40px;height:max(9vh,44px);border-radius:8px;
    border:2px solid #9bb6d4;box-sizing:border-box;background:#fff;padding:0;font:600 min(3.4vh,2.2vw)/1 inherit;
    color:#1d3557;touch-action:manipulation;cursor:pointer}
  #dots button b{position:absolute;left:0;right:0;bottom:0;background:#a8dcbc;transition:height .5s ease}
  #dots button span{position:relative}
  #dots button.cur{border-color:#1d3557;border-width:3px;background:#e4eefa}
  #dots button:active{transform:scale(.94)}
  .btn{flex:0 0 auto;width:14vh;height:14vh;border-radius:50%;border:0;font-size:7vh;color:#1d3557;padding:0;
    background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;
    touch-action:manipulation}
  .btn:active{transform:scale(.94)}
  #ok{background:#2a9d5c;color:#fff}
  #btns{display:flex;gap:1.2vw;justify-content:flex-end}
  .btn svg{width:62%;height:62%}
  #stage{flex:1;position:relative;background:#fff}
  canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
  #ink{cursor:crosshair}
  #ver{position:fixed;right:6px;bottom:3px;font:11px sans-serif;color:#bbb;pointer-events:none}
  .overlay{position:fixed;inset:0;background:#f1f6fc;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:4vh;z-index:10;text-align:center;color:#1d3557}
  #start button{font-size:min(9vh,6vw);font-weight:600;font-family:inherit;padding:3vh 6vw;border-radius:5vh;border:0;
    background:#2a9d5c;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.3)}
  #start h1{font-size:min(11vh,7vw);margin:0}
  #rotate{display:none;z-index:20;font-size:5vw}
  #rotate div{font-size:20vw}
  @media (orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="prog"><div id="dots"></div></div>
    <div id="mid"><div id="msg"></div></div>
    <div id="btns">
      <button class="btn" id="hear" aria-label="கேளுங்க"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 24h12L34 9v46L18 40H6z" fill="currentColor"/><path d="M44 22a14 14 0 0 1 0 20M51 13a25 25 0 0 1 0 38" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg></button>
      <button class="btn" id="clear" aria-label="அழிங்க">🗑️</button>
      <button class="btn" id="ok" aria-label="முடிஞ்சுது">✔</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="base"></canvas>
    <canvas id="anim" style="pointer-events:none"></canvas>
    <canvas id="ink"></canvas>
  </div>
</div>
<div id="start" class="overlay">
  <h1>கிழமை எழுதலாம் வாங்க</h1>
  <button id="go">ஆரம்பிங்க ▶</button>
</div>
<div id="rotate" class="overlay"><div>📱↻</div>ஃபோனைச் சாய்ச்சுப் பிடிங்க</div>
<div id="ver">ta v4</div>

var STRICT={};   // extra per-name switch; units carrying strict:true in STROKES are already strict

var $=function(id){return document.getElementById(id);};
var base=$('base'),anim=$('anim'),ink=$('ink');
var bctx=base.getContext('2d'),actx=anim.getContext('2d'),ictx=ink.getContext('2d');
var msgEl=$('msg'),dotsEl=$('dots');

var idx=0;
try{idx=parseInt(localStorage.getItem('days_ta_dayIdx'),10)||0;}catch(e){}
if(idx<0||idx>6)idx=0;
var passes=[0,0,0,0,0,0,0];
try{var sp=JSON.parse(localStorage.getItem('days_ta_passes'));
  if(Array.isArray(sp)&&sp.length===7)passes=sp.map(function(n){return Math.max(0,Math.min(3,n|0));});}catch(e){}
function savePasses(){try{localStorage.setItem('days_ta_passes',JSON.stringify(passes));}catch(e){}}

var W=0,H=0,dpr=1,fs=100,baseY=0,textL=0,textR=0,PEN=10,R=10,ASC=70,AC=null;
var strokes=[],cur=null,penSeen=false;
var inputOn=false,token=0,started=false;

function word(){return DAYS[idx];}
function msg(t){msgEl.textContent=t;}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

// Day tiles: progress fill (0-3 passes) under the day's first letter. Tap a day to jump straight to it;
// tap the current day to start it over with the grey guide and demo.
var TILE=['தி','செ','பு','வி','வெ','ச','ஞா'];
function drawDots(){
  dotsEl.innerHTML='';
  for(var i=0;i<7;i++){
    var d=document.createElement('button'),f=document.createElement('b'),s=document.createElement('span');
    f.style.height=(passes[i]/3*100)+'%';s.textContent=TILE[i];
    d.appendChild(f);d.appendChild(s);d.dataset.i=i;d.setAttribute('aria-label',DAYS[i]);
    if(i===idx)d.className='cur';
    dotsEl.appendChild(d);
  }
}
function goDay(i){
  if(!started)return;
  token++;inputOn=false;fading=null;
  try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}
  idx=i;attempt=0;
  try{localStorage.setItem('days_ta_dayIdx',idx);}catch(e){}
  intro();
}
dotsEl.addEventListener('click',function(e){
  var b=e.target.closest('button');if(b)goDay(+b.dataset.i);
});

/* ---------- speech ---------- */
var voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  var vs=speechSynthesis.getVoices();
  for(var i=0;i<vs.length;i++){if(/^ta/i.test(vs[i].lang)){voice=vs[i];break;}}
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text){
  return new Promise(function(res){
    if(!('speechSynthesis' in window)){setTimeout(res,1200);return;}
    try{
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.lang='ta-IN';u.rate=0.65;if(voice)u.voice=voice;
      var done=false;function fin(){if(!done){done=true;res();}}
      u.onend=fin;u.onerror=fin;
      setTimeout(fin,4500);
      speechSynthesis.speak(u);
    }catch(e){setTimeout(res,1200);}
  });
}

/* ---------- layout ---------- */
function sizeCanvas(c){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);}
function layout(){
  var r=$('stage').getBoundingClientRect();
  W=Math.max(50,Math.round(r.width));H=Math.max(50,Math.round(r.height));
  dpr=Math.min(window.devicePixelRatio||1,3);
  [base,anim,ink].forEach(sizeCanvas);
  [bctx,actx,ictx].forEach(function(c){c.setTransform(dpr,0,0,dpr,0,0);});
  fitWord();
  PEN=Math.max(8,Math.min(16,fs*0.07));
  R=fs*0.11;
  strokes=[];cur=null;
  buildModel();
  drawBase();
}
function fitWord(){
  fs=H*0.66;
  bctx.font='600 '+fs+'px '+FONT;
  var w=bctx.measureText(word()).width;
  if(w>W*0.92)fs=fs*W*0.92/w;
  bctx.font='600 '+fs+'px '+FONT;
  w=bctx.measureText(word()).width;
  ASC=bctx.measureText('ம').actualBoundingBoxAscent||fs*0.55; // x-height of a plain Tamil letter
  textL=(W-w)/2;textR=textL+w;
  baseY=H/2+ASC/2;
}
function guides(ctx){
  // Tamil has no headline: letters sit on a baseline (solid), bodies reach the x-height (dashed);
  // vowel signs such as ி rise above it and ு drops below, hence the outer dashed lines.
  var top=baseY-ASC,topMatra=top-fs*0.28,low=baseY+fs*0.28;
  ctx.save();
  ctx.strokeStyle='#bcd9f2';ctx.lineWidth=2;
  [topMatra,top,baseY,low].forEach(function(y,i){
    ctx.setLineDash(i===2?[]:[10,8]);
    ctx.globalAlpha=i===2?0.9:0.7;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  });
  ctx.restore();
}
function drawWord(ctx,color){
  ctx.font='600 '+fs+'px '+FONT;
  ctx.textBaseline='alphabetic';ctx.textAlign='left';
  ctx.fillStyle=color;
  ctx.fillText(word(),textL,baseY);
}
function drawBase(){
  bctx.clearRect(0,0,W,H);
  guides(bctx);
  if(attempt===0)drawWord(bctx,'#d2d2d2');
}
function drawFade(p){
  actx.clearRect(0,0,W,H);
  if(p>=1)return;
  var soft=fs*0.4,e=textL-soft+((textR-textL)+soft)*p;
  actx.save();
  drawWord(actx,'#d2d2d2');
  actx.globalCompositeOperation='destination-out';
  var g=actx.createLinearGradient(e,0,e+soft,0);
  g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
  actx.fillStyle=g;actx.fillRect(0,0,W,H);
  actx.restore();
}
var fading=null; // {t0,dur} while the grey target is fading
async function fadeOut(t,dur){
  var t0=performance.now();fading={t0:t0,dur:dur};
  while(t===token){
    var p=Math.min(1,(performance.now()-t0)/dur);
    drawFade(p);
    if(p>=1)break;
    await frame();
  }
}
function redrawInk(){
  ictx.clearRect(0,0,W,H);
  strokes.forEach(function(st){paintStroke(st,'#1d3557');});
}
function paintStroke(st,color){
  var p=st.pts;
  ictx.fillStyle=color;ictx.strokeStyle=color;ictx.lineWidth=PEN;ictx.lineCap='round';ictx.lineJoin='round';
  ictx.beginPath();ictx.arc(p[0].x,p[0].y,PEN/2,0,6.283);ictx.fill();
  ictx.beginPath();ictx.moveTo(p[0].x,p[0].y);
  for(var i=1;i<p.length;i++)ictx.lineTo(p[i].x,p[i].y);
  ictx.stroke();
}
function clearInk(){
  strokes=[];cur=null;ictx.clearRect(0,0,W,H);resetProgress();
}

/* ---------- stroke model ---------- */
// units[] for the current word, in canvas pixels:
//  {name, segs:[[{x,y}...]], pts:[{x,y,seg}] (samples in writing order), dot:{x,y,r}|null, strict}
var units=[],allPts=[],lineW=10;
var prog=null; // per attempt: {cur, cov:[[bool]], dotDone:[bool], mistakes, sp:[int]}
function P(q){return {x:textL+q[0]*fs,y:baseY+q[1]*fs};}
function buildModel(){
  var data=STROKES[word()]||[];
  lineW=(STROKES[word()+'#sw']||0.11)*fs;
  var step=fs*0.03;
  units=data.map(function(u,ui){
    var segs=u.s.map(function(s){return s.map(P);});
    var pts=[];
    segs.forEach(function(s,si){
      for(var i=1;i<s.length;i++){
        var a=s[i-1],b=s[i],L=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(L/step));
        for(var k=(i===1?0:1);k<=n;k++)pts.push({x:a.x+(b.x-a.x)*k/n,y:a.y+(b.y-a.y)*k/n,seg:si});
      }
    });
    return {name:u.n,segs:segs,pts:pts,dot:u.d?{x:textL+u.d[0]*fs,y:baseY+u.d[1]*fs,r:u.d[2]*fs}:null,
            strict:!!(u.strict||STRICT[u.n])};
  });
  allPts=[];
  units.forEach(function(u,ui){u.pts.forEach(function(p,pi){allPts.push({x:p.x,y:p.y,u:ui,i:pi});});});
  resetProgress();
}
function resetProgress(){
  prog={cur:0,mistakes:0,
    cov:units.map(function(u){return u.pts.map(function(){return false;});}),
    dotDone:units.map(function(u){return !u.dot;}),
    sp:units.map(function(){return 0;})};
}
function bodyDone(ui){
  var c=prog.cov[ui],n=0;for(var i=0;i<c.length;i++)if(c[i])n++;
  return n>=c.length*0.8;
}
function allDone(){
  for(var i=0;i<units.length;i++)if(!bodyDone(i)||!prog.dotDone[i])return false;
  return true;
}
function advance(){while(prog.cur<units.length&&bodyDone(prog.cur))prog.cur++;}
function credit(ui,p){
  var u=units[ui],c=prog.cov[ui],r2=Math.pow(fs*0.11,2);
  for(var i=0;i<u.pts.length;i++){var q=u.pts[i];if(!c[i]&&(q.x-p.x)*(q.x-p.x)+(q.y-p.y)*(q.y-p.y)<=r2)c[i]=true;}
}
function resample(pts,step){
  var out=[pts[0]],acc=0;
  for(var i=1;i<pts.length;i++){
    var a=out[out.length-1],b=pts[i],d=Math.hypot(b.x-a.x,b.y-a.y);
    if(d>=step)out.push(b);
  }
  if(out.length===1&&pts.length>1)out.push(pts[pts.length-1]);
  return out;
}
function nearest(p,list){
  var best=null,bd=1e18;
  for(var i=0;i<list.length;i++){var q=list[i],d=(q.x-p.x)*(q.x-p.x)+(q.y-p.y)*(q.y-p.y);if(d<bd){bd=d;best=q;}}
  return {q:best,d:Math.sqrt(bd)};
}
// Judge one finished stroke. Returns null if fine, else an error kind: 'order' | 'dir' | 'stray'.
function judge(st){
  var raw=st.pts,len=0;
  for(var i=1;i<raw.length;i++)len+=Math.hypot(raw[i].x-raw[i-1].x,raw[i].y-raw[i-1].y);
  var TOL=fs*0.15;
  if(len<fs*0.12){
    // a tap: is it a pulli dot?
    var cx=0,cy=0;raw.forEach(function(p){cx+=p.x;cy+=p.y;});cx/=raw.length;cy/=raw.length;
    for(var k=0;k<units.length;k++){
      var d=units[k].dot;
      if(d&&Math.hypot(cx-d.x,cy-d.y)<Math.max(d.r*2.2,fs*0.13)){
        if(!bodyDone(k))return 'order';     // the dot comes after its letter
        prog.dotDone[k]=true;return null;
      }
    }
    if(nearest({x:cx,y:cy},allPts).d>TOL)return 'stray';
    // otherwise treat as a short touch on a letter, below
  }
  var pts=resample(raw,fs*0.02),own=[],stray=0;
  for(i=0;i<pts.length;i++){
    var n=nearest(pts[i],allPts);
    if(n.d>TOL){own.push(-1);stray++;}else own.push(n.q.u);
  }
  if(stray>pts.length*0.35)return 'stray';
  var ahead=0;
  for(i=0;i<pts.length;i++){
    var u=own[i];if(u<0)continue;
    if(u<prog.cur){continue;}                // going over a finished letter: ignore
    if(u>prog.cur){
      advance();
      if(u>prog.cur){ if(++ahead>=4)return 'order'; continue; } // jumped ahead of an unfinished letter
    }
    ahead=0;
    var unit=units[u];
    if(unit.strict){
      // within-letter order and direction: each point must sit on the next stretch of the path
      // prefer the nearest stretch just ahead, so a line written back over itself (down then up) reads as forward
      var sp0=prog.sp[u],best=-1,fwd=-1;
      for(var j=0;j<unit.pts.length;j++){
        var q=unit.pts[j];
        if(Math.hypot(q.x-pts[i].x,q.y-pts[i].y)<TOL){
          if(best<0||Math.abs(j-sp0)<Math.abs(best-sp0))best=j;
          if(j>=sp0-3&&j<=sp0+25&&(fwd<0||j<fwd))fwd=j;
        }
      }
      if(fwd>=0)best=fwd;
      if(best>=0){
        if(best<sp0-7)return 'dir';                       // moving backwards along the path
        var segNow=unit.pts[sp0].seg,segNew=unit.pts[best].seg;
        if(segNew>segNow){                               // starting a later stroke: this one must be (mostly) done
          var tot=0,hit=0,c=prog.cov[u];
          for(var m=0;m<unit.pts.length;m++)if(unit.pts[m].seg===segNow){tot++;if(c[m])hit++;}
          if(hit<tot*0.8)return 'order';
        }
        if(best>sp0)prog.sp[u]=best;
      }
    }
    credit(u,pts[i]);
  }
  advance();
  return null;
}

/* ---------- demo animation ---------- */
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function frame(){return new Promise(function(r){requestAnimationFrame(r);});}
function segLen(s){var L=0;for(var i=1;i<s.length;i++)L+=Math.hypot(s[i].x-s[i-1].x,s[i].y-s[i-1].y);return L;}
function drawPartial(s,L){
  actx.beginPath();actx.moveTo(s[0].x,s[0].y);
  var acc=0;
  for(var i=1;i<s.length;i++){
    var d=Math.hypot(s[i].x-s[i-1].x,s[i].y-s[i-1].y);
    if(acc+d>=L){var f=(L-acc)/d;actx.lineTo(s[i-1].x+(s[i].x-s[i-1].x)*f,s[i-1].y+(s[i].y-s[i-1].y)*f);break;}
    actx.lineTo(s[i].x,s[i].y);acc+=d;
  }
  actx.stroke();
}
// Writes the given units stroke by stroke in dark ink on the anim layer, then fades it away.
async function playStrokes(t,list){
  var total=0;list.forEach(function(u){u.segs.forEach(function(s){total+=segLen(s);});});
  var speed=Math.max(fs*2,total/8);          // px per second; whole word in about 8 s at most
  var done=[];                               // finished segments, redrawn each frame
  actx.lineCap='round';actx.lineJoin='round';
  function paintDone(){
    actx.clearRect(0,0,W,H);
    actx.strokeStyle='#444';actx.lineWidth=lineW*0.85;
    done.forEach(function(s){if(!s.dot)drawPartial(s,1e9);});
    done.forEach(function(s){if(s.dot){actx.fillStyle='#444';actx.beginPath();actx.arc(s.dot.x,s.dot.y,s.dot.r,0,6.283);actx.fill();}});
  }
  for(var ui=0;ui<list.length;ui++){
    var u=list[ui];
    for(var si=0;si<u.segs.length;si++){
      var s=u.segs[si],L=segLen(s),dur=Math.max(250,L/speed*1000),t0=performance.now();
      while(true){
        if(t!==token)return false;
        var p=Math.min(1,(performance.now()-t0)/dur);
        paintDone();
        actx.strokeStyle='#444';actx.lineWidth=lineW*0.85;
        drawPartial(s,L*ease(p));
        // green start marker
        actx.fillStyle='#2a9d5c';actx.beginPath();actx.arc(s[0].x,s[0].y,lineW*0.42,0,6.283);actx.fill();
        if(p>=1)break;
        await frame();
      }
      done.push(s);
      await sleep(120);
    }
    if(u.dot){
      var dd={dot:u.dot};
      for(var k=0;k<=8;k++){
        if(t!==token)return false;
        paintDone();
        actx.fillStyle='#444';actx.beginPath();actx.arc(u.dot.x,u.dot.y,u.dot.r*k/8,0,6.283);actx.fill();
        await frame();
      }
      done.push(dd);
      await sleep(150);
    }
  }
  paintDone();
  await sleep(500);
  var f0=performance.now();
  while(true){
    if(t!==token)return false;
    var q=Math.min(1,(performance.now()-f0)/600);
    actx.save();actx.globalAlpha=1-q;paintDone();actx.restore();
    if(q>=1)break;
    await frame();
  }
  actx.clearRect(0,0,W,H);
  return true;
}

/* ---------- main flow ---------- */
async function intro(){
  var t=++token;
  inputOn=false;fading=null;clearInk();actx.clearRect(0,0,W,H);
  fitWord();buildModel();drawBase();drawDots();
  if(attempt>0)drawFade(0);
  msg(word());
  if(attempt===0){
    await say(word());if(t!==token)return;
    await sleep(300);
    if(!(await playStrokes(t,units)))return;
    inputOn=true;
    return;
  }
  inputOn=true;
  await say(word());if(t!==token)return;
  await sleep(HOLD_MS);if(t!==token)return;
  fadeOut(t,FADE_MS[attempt]);
}
// A stroke broke the rules: show it in red, take it away, explain, and show the right way.
async function correct(st,kind){
  var t=++token;inputOn=false;prog.mistakes++;
  var keepFade=fading;
  paintStroke(st,'#d62828');
  var text=kind==='order'?ORDER:kind==='dir'?DIRECTION:STRAY;
  msg(text);
  await sleep(900);if(t!==token)return;
  strokes.pop();redrawInk();
  advance();
  // show the right way: the letter that is due, or (if all letters are written) the first missing dot
  var show=null;
  if(prog.cur<units.length)show=[{segs:units[prog.cur].segs,dot:null}];
  else for(var i=0;i<units.length;i++)if(!prog.dotDone[i]){show=[{segs:[],dot:units[i].dot}];break;}
  if(show){
    if(!(await playStrokes(t,show)))return;
  }
  msg(word());inputOn=true;
  if(keepFade){
    // carry on fading from where it was
    var p0=Math.min(1,(performance.now()-keepFade.t0)/keepFade.dur);
    var rest=keepFade.dur*(1-p0),t1=performance.now();
    (async function(){
      while(t===token){
        var p=Math.min(1,p0+(performance.now()-t1)/keepFade.dur);
        drawFade(p);if(p>=1)break;await frame();
      }
    })();
  }
}

/* ---------- drawing input ---------- */
function pos(e){var r=ink.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
ink.addEventListener('pointerdown',function(e){
  if(!inputOn)return;
  if(e.pointerType==='pen')penSeen=true;
  else if(e.pointerType==='touch'&&penSeen)return; // palm rejection
  e.preventDefault();
  try{ink.setPointerCapture(e.pointerId);}catch(x){}
  var p=pos(e);
  cur={id:e.pointerId,pts:[p]};strokes.push(cur);
  ictx.fillStyle='#1d3557';ictx.beginPath();ictx.arc(p.x,p.y,PEN/2,0,6.283);ictx.fill();
});
ink.addEventListener('pointermove',function(e){
  if(!cur||e.pointerId!==cur.id)return;
  e.preventDefault();
  var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[e];
  if(!evs.length)evs=[e];
  ictx.strokeStyle='#1d3557';ictx.lineWidth=PEN;ictx.lineCap='round';ictx.lineJoin='round';
  for(var i=0;i<evs.length;i++){
    var p=pos(evs[i]),q=cur.pts[cur.pts.length-1];
    ictx.beginPath();ictx.moveTo(q.x,q.y);ictx.lineTo(p.x,p.y);ictx.stroke();
    cur.pts.push(p);
  }
});
function up(e){
  if(!cur||e.pointerId!==cur.id)return;
  var st=cur;cur=null;
  if(!inputOn)return;
  var snap=JSON.parse(JSON.stringify(prog));
  var err=judge(st);
  if(err){prog=snap;correct(st,err);}
}
ink.addEventListener('pointerup',up);
ink.addEventListener('pointercancel',up);

/* ---------- scoring (shape) ---------- */
function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function drawStrokes(ctx,width,s){
  ctx.strokeStyle='#000';ctx.fillStyle='#000';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=width*s;
  strokes.forEach(function(st){
    var p=st.pts;
    ctx.beginPath();ctx.arc(p[0].x*s,p[0].y*s,width*s/2,0,6.283);ctx.fill();
    ctx.beginPath();ctx.moveTo(p[0].x*s,p[0].y*s);
    for(var i=1;i<p.length;i++)ctx.lineTo(p[i].x*s,p[i].y*s);
    ctx.stroke();
  });
}
function score(){
  var s=0.5,w=Math.round(W*s),h=Math.round(H*s);
  var cM=mk(w,h),cW=mk(w,h),cI=mk(w,h),cD=mk(w,h);
  var m=cM.getContext('2d'),wd=cW.getContext('2d'),it=cI.getContext('2d'),dl=cD.getContext('2d');
  [m,wd].forEach(function(c){c.font='600 '+(fs*s)+'px '+FONT;c.textBaseline='alphabetic';c.fillStyle='#000';c.strokeStyle='#000';});
  m.fillText(word(),textL*s,baseY*s);
  wd.fillText(word(),textL*s,baseY*s);
  wd.lineWidth=2*R*s;wd.lineJoin='round';wd.strokeText(word(),textL*s,baseY*s);
  drawStrokes(it,PEN,s);
  drawStrokes(dl,PEN+2*R*0.9,s);
  var aM=m.getImageData(0,0,w,h).data,aW=wd.getImageData(0,0,w,h).data,
      aI=it.getImageData(0,0,w,h).data,aD=dl.getImageData(0,0,w,h).data;
  var mTot=0,mHit=0,iTot=0,iHit=0;
  for(var i=3;i<aM.length;i+=4){
    if(aM[i]>100){mTot++;if(aD[i]>100)mHit++;}
    if(aI[i]>100){iTot++;if(aW[i]>100)iHit++;}
  }
  if(!iTot||!mTot)return {score:0,cover:0,prec:0,empty:true};
  var cover=mHit/mTot,prec=iHit/iTot;
  return {score:(cover+prec)/2,cover:cover,prec:prec,empty:false};
}
// for testing
window.__score=score;
window.__t={units:function(){return units;},prog:function(){return prog;},judge:judge,
  setStrict:function(name,on){STRICT[name]=on;units.forEach(function(u){if(u.name===name)u.strict=on;});},
  state:function(){return {idx:idx,attempt:attempt,inputOn:inputOn,msg:msgEl.textContent};}};

function bell(){
  if(!AC)return;
  try{
    if(AC.state==='suspended')AC.resume();
    var now=AC.currentTime,master=AC.createGain();
    master.gain.value=0.4;master.connect(AC.destination);
    [[880,1,1.8],[880*2.76,0.5,1.1],[880*5.4,0.25,0.7],[880*8.93,0.12,0.4]].forEach(function(p){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=p[0];
      g.gain.setValueAtTime(0.0001,now);
      g.gain.linearRampToValueAtTime(p[1],now+0.005);
      g.gain.exponentialRampToValueAtTime(0.0001,now+p[2]);
      o.connect(g);g.connect(master);o.start(now);o.stop(now+p[2]+0.05);
    });
  }catch(e){}
}
async function check(){
  if(!inputOn)return;
  var r=score();
  if(r.empty)return;
  inputOn=false;
  var t=++token;
  // a pass needs the right shape AND every letter, sign and dot written, in order, with no corrections
  var ok=r.score>=PASS&&allDone()&&prog.mistakes===0;
  var bodies=units.every(function(u,i){return bodyDone(i);});
  var m=ok?'✓ '+word():(r.score>=PASS&&prog.mistakes>0?ORDER:
        (r.score>=PASS&&bodies&&!allDone()?NODOT:(r.score>=HALF?CAREFUL:AGAIN)));
  var lastAttempt=(attempt===2),lastDay=(idx===6);
  if(ok){passes[idx]=Math.min(3,passes[idx]+1);savePasses();drawDots();bell();}
  msg(m);
  await sleep(PAUSE_MS);if(t!==token)return;
  if(lastAttempt){
    attempt=0;
    idx=lastDay?0:idx+1;
    try{localStorage.setItem('days_ta_dayIdx',idx);}catch(e){}
  }else{
    attempt++;
  }
  intro();
}

/* ---------- buttons ---------- */
$('ok').addEventListener('click',check);
$('clear').addEventListener('click',function(){
  if(!inputOn)return;
  clearInk();msg(word());
  if(attempt>0){
    var t=++token;fading=null;drawFade(0);
    (async function(){await sleep(HOLD_MS);if(t!==token)return;fadeOut(t,FADE_MS[attempt]);})();
  }
});
$('hear').addEventListener('click',function(){say(word());});

$('go').addEventListener('click',function(){
  $('start').style.display='none';
  // iPad/iPhone Safari drops element fullscreen on the first pen or finger tap, which resized the page mid-word.
  // There, skip it: open the app from the Home Screen instead (Share > Add to Home Screen) for true full screen.
  var iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var standalone=navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone),(display-mode: fullscreen)').matches);
  if(!iOS&&!standalone){try{var el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}catch(e){}}
  try{screen.orientation.lock('landscape').catch(function(){});}catch(e){}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume();}catch(e){AC=null;}
  try{if('speechSynthesis' in window){var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}}catch(e){}
  started=true;
  setTimeout(async function(){
    try{await Promise.race([document.fonts.load('600 40px "NSTa"','திங்கள்'),sleep(3000)]);}catch(e){}
    layout();intro();
  },250);
});

var rt;
window.addEventListener('resize',function(){
  clearTimeout(rt);
  rt=setTimeout(function(){
    if(!started)return;
    // While writing: rescale the ink and the guide to the new size and carry on with the same attempt.
    // At any other moment (demo playing, checking), restart the attempt as before.
    if(inputOn&&!cur){
      var o={l:textL,b:baseY,f:fs},keep=strokes,pr=prog;
      layout();
      strokes=keep.map(function(st){return {id:st.id,pts:st.pts.map(function(p){
        return {x:textL+(p.x-o.l)/o.f*fs,y:baseY+(p.y-o.b)/o.f*fs};})};});
      if(pr&&pr.cov.length===units.length&&pr.cov.every(function(c,i){return c.length===units[i].pts.length;}))prog=pr;
      else{prog=pr;resetProgress();prog.mistakes=pr?pr.mistakes:0;}
      redrawInk();
      if(attempt>0){var fp=fading?Math.min(1,(performance.now()-fading.t0)/fading.dur):0;drawFade(fp);}
      return;
    }
    layout();intro();
  },200);
});

drawDots();
})();
</script>
